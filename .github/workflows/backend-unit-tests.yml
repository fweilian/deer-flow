name: Unit Tests

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default-install-collection:
    # The main job installs --extra mysql; this job proves the documented
    # contributor path (uv sync --group dev, no extras) still collects the
    # whole suite, so optional-dependency imports must stay lazy.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install backend dependencies (documented default)
        working-directory: backend
        run: uv sync --group dev

      - name: Collect backend tests
        working-directory: backend
        run: uv run pytest --collect-only -q

  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Duration-aware split: `make test-shard` balances the shards by real
      # wall-clock cost from backend/.test_durations (read-only for shards, so
      # concurrent jobs never race writes on it). Every test runs exactly once.
      # Fail-fast is off so a failing shard reports its tests without cancelling
      # its peers.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mysql:
        image: mysql:8.0.24
        env:
          MYSQL_ROOT_PASSWORD: deerflow
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: deerflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pdeerflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_MYSQL_URI: mysql+asyncmy://root:deerflow@127.0.0.1:3306/deerflow_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --extra mysql

      - name: Run unit tests of backend (shard ${{ matrix.shard }} of 4)
        working-directory: backend
        run: make test-shard SPLITS=4 GROUP=${{ matrix.shard }}
