[project]
name = "deer-flow"
version = "2.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    # Direct dependency on purpose, even though deerflow-harness already pulls
    # it in: app/gateway/app.py and app/gateway/services.py import the public
    # contract package themselves (the extension principal resolver, and the
    # provenance key set the state route strips). Those are the app layer's own
    # imports of a package whose whole point is a stable public surface, so the
    # app declares them rather than relying on the harness to keep supplying it.
    "deerflow-extension-api",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.31",
    "sse-starlette>=2.1.0",
    # Direct dependency on purpose, even though FastAPI already pulls it in:
    # app/gateway/request_path.py imports the private
    # `starlette._utils.get_route_path` so the auth and CSRF predicates
    # classify the exact string Starlette's router matches on. A private
    # import is the safest option here because it fails loudly (ImportError at
    # startup) instead of silently drifting from the dispatcher at a security
    # boundary -- but it does mean a Starlette bump is a security-relevant
    # change. Declaring and bounding it here makes that bump visible in the
    # diff; tests/test_gateway_request_path.py pins the agreement itself.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.34.0",
    "langgraph-sdk>=0.1.51",
    "bcrypt>=4.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
postgres = ["deerflow-harness[postgres]"]
redis = ["deerflow-harness[redis]"]
monocle = ["deerflow-harness[monocle]"]
ollama = ["deerflow-harness[ollama]"]
memory-zh = ["deerflow-harness[memory-zh]"]

[dependency-groups]
# Managed extension packages are added here by `deerflow extensions install`.
# Keeping them separate from development tooling lets every startup mode sync
# the same locked runtime set without promoting those packages to core deps.
extensions = []
dev = [
    "blockbuster>=1.5.26,<1.6",
    "hypothesis>=6.100,<7",
    "jsonschema>=4.26.0",
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-split>=0.11.0",
    "ruff>=0.14.11",
    # Monocle tracer (also the deerflow-harness[monocle] extra); kept in the dev
    # group so the tracing tests can import it without forcing it onto installs.
    "monocle_apptrace>=0.8.8",
    # redis is an optional runtime extra (deerflow-harness[redis]); pin it in the
    # dev group so the stream-bridge tests can always import/exercise the redis
    # bridge without forcing it onto production installs.
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "allow_blocking_io: opt out of the strict Blockbuster gate in tests/blocking_io/",
    "integration: tests that require an external service (e.g. Redis); skipped when unavailable",
    "live: tests that call real external APIs and require explicit opt-in",
]

[tool.uv]
index-url = "https://pypi.org/simple"
default-groups = ["dev", "extensions"]
[tool.uv.workspace]
members = ["packages/harness", "packages/extension-api"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
deerflow-extension-api = { workspace = true }
